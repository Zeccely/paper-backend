
variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  SONAR_USER_HOME: "C:\\sonar-cache"
  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task


stages:
  - build
  - test
  - build-sonar
  - publish

build:
  stage: build
  before_script:
    - cd "$Env:CI_PROJECT_DIR\I_Hate_Paper" 
  script:
    - .\gradlew.bat assemble
  artifacts:
    paths:
      - I_Hate_Paper/build/libs/*.jar
  
test:
  stage: test
  before_script:
    - cd "$Env:CI_PROJECT_DIR\I_Hate_Paper"
    - .\gradlew test jacocoTestReport
  script:
    - .\gradlew test

build-sonar:
  stage: build-sonar
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "C:\\sonar-cache\\cache" 
  before_script:
    - cd "$Env:CI_PROJECT_DIR\I_Hate_Paper"
  script:
    - .\gradlew.bat jacocoTestReport sonar
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"


publish:
  stage: publish
  before_script:
    - cd "$Env:CI_PROJECT_DIR\I_Hate_Paper" 
  script:
    - docker build -t zeccely/i_hate_paper-backend:latest . --no-cache
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PATTOKEN"
    - docker push zeccely/i_hate_paper-backend:latest
  dependencies:
    - build
    
