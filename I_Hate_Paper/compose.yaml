
services:
  db:
    image: mysql:8.0
    container_name: paperdatabasey
    environment:
      MYSQL_ROOT_PASSWORD: "@Ilikecake12"
      MYSQL_DATABASE: "paperdatabase"
      MYSQL_PASSWORD: "@Ilikecake12"
    ports:
      - "3305:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperbackend
    depends_on:
      db:
        condition: service_healthy
    environment:
      dockerdatabaseurl: "jdbc:mysql://db:3306/paperdatabase"
      paperusernamedb: "root"
      passdockerdb: "@Ilikecake12"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8080:8080"


volumes:
  db-data:
