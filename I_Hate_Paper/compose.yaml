
services:

  db:
    image: mysql:8.0
    container_name: paperdatabasey
    environment:
      MYSQL_ROOT_PASSWORD: "@Ilikecake12"
      MYSQL_DATABASE: "paperdatabase"
      MYSQL_PASSWORD: "@Ilikecake12"
    ports:
      - "3305:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      --interval 60 i_hate_paper-frontend i_hate_paper-backend

  backend:
    image: zeccely/i_hate_paper-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      dockerdatabaseurl: "jdbc:mysql://db:3306/paperdatabase"
      paperusernamedb: "root"
      passdockerdb: "@Ilikecake12"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      UPLOAD_PATH: "/app/dokks"
    volumes:
      - "C:/Users/jepis/Desktop/Dokks:/app/dokks"
    ports:
      - "8080:8080"

  frontend:
    image: zeccely/i_hate_paper-frontend:latest
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db-data:
